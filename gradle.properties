# JVM arguments for the Gradle daemon. Kept modest so the build also works on machines
# with limited RAM (the Kotlin daemon and R8 workers run alongside it).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin compilation runs in its own daemon; bound it too.
kotlin.daemon.jvmargs=-Xmx1536m

# AndroidX is mandatory for Jetpack Compose / Room / DataStore.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

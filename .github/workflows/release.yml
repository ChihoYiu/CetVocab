name: Release

# 打 tag（v1.0.0 这种）或手动触发时，构建**已签名**的 release 包并作为 Release 资产上传。
#
# 签名信息全部来自仓库 Secrets，代码里没有任何密钥。没有配置 Secrets 时本工作流会跳过签名构建，
# 不会失败、也不会生成可安装的包 —— 这样 fork 出去的人不会误以为能直接出正式包。
#
# 需要的 Secrets（见 docs/RELEASE_SIGNING.md）：
#   KEYSTORE_BASE64    —— 密钥库文件的 base64（`base64 -w0 cetvocab-release.jks`）
#   KEYSTORE_PASSWORD  —— 密钥库口令
#   KEY_ALIAS          —— 密钥别名
#   KEY_PASSWORD       —— 密钥口令

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    name: 签名 release 包
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: 检查签名 Secrets 是否存在
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，跳过签名构建（仅在本仓库配置 Secrets 后可用）"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 还原密钥库到临时目录（不进入工作区，避免被打包或缓存）
        if: steps.check.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          ls -l "$RUNNER_TEMP/signing/release.jks"

      - name: 运行测试
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 构建已签名 release 包
        if: steps.check.outputs.present == 'true'
        env:
          CETVOCAB_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          CETVOCAB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CETVOCAB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CETVOCAB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -x lintVitalRelease

      - name: 校验签名结果
        if: steps.check.outputs.present == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "产物: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: 上传到 Release
        if: steps.check.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          # 固定说明头部 + GitHub 自动生成的提交变更列表。
          generate_release_notes: true
          body: |
            **这是用正式密钥签名的安装包**（`app-release.apk`），可以直接安装。

            安装：下载后在手机上允许「安装未知来源应用」；若提示「未通过安全检测」，选择继续安装即可
            （自有签名包的正常提示）。

            运行要求：Android 8.0（API 26）及以上；朗读功能需要系统已安装文字转语音引擎与英语语音包。
            不需要联网，**不申请 `INTERNET` 权限**。

            本次构建已通过全部单元测试，并在打包后用 `apksigner verify --print-certs` 校验了签名。
            使用说明见 [docs/USER_GUIDE.md](https://github.com/ChihoYiu/CetVocab/blob/main/docs/USER_GUIDE.md)；
            第三方内容许可见 [THIRD-PARTY-NOTICES.md](https://github.com/ChihoYiu/CetVocab/blob/main/THIRD-PARTY-NOTICES.md)。

      - name: 清理密钥库
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

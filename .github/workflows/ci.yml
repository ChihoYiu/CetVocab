name: CI

# 每次推送到 main 或发起 PR 时：跑全部单元测试并构建调试包。
# 这样 README 上的构建徽章反映的是**真实**结果，而不是手写的状态。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一个分支上新的推送会取消上一次仍在排队/运行的构建，省时间也省钱。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 单元测试 + 调试包
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 项目以 Java 17 字节码为目标，AGP 9 需要 JDK 17+；选 LTS 21 作为 CI 的 JDK。
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装 Android SDK（platform 36 与 build-tools 36.0.0）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: 授予 Gradle 可执行权限
        run: chmod +x ./gradlew

      # 测试里用了 Robolectric，它会按需下载 android-all 依赖：CI 有网络，无需额外步骤。
      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建调试包
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传测试报告（失败时也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: 上传调试包
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
